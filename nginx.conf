server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /web-components {
        return 301 /web-components/$is_args$args;
    }

    location /web-components/ {
        try_files $uri $uri/ /web-components/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
