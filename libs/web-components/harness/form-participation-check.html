<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form participation + CSS Parts check</title>
    <!-- Fira Sans, matching styles.css — without it the font-family resolves but the glyphs
         fall back to the OS sans-serif (see FINDINGS.md Section 10 follow-up). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@100;200;300;400;500;600;700;800;900&family=Fira+Code:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Fira Sans', sans-serif;
        padding: 24px;
        max-width: 720px;
      }
      fieldset {
        margin-bottom: 16px;
      }
      pre {
        background: #f5f5f5;
        padding: 12px;
        overflow-x: auto;
      }

      /*
       * CSS Parts probe (CTORNDSD-646b). These rules live in the LIGHT DOM and target internals
       * of a shadow root. Only `::part()` can do this — a plain descendant selector such as
       * `gd-button button { ... }` cannot cross the boundary at all. If these apply, `::part()`
       * works; the control below proves the non-part selector does NOT apply.
       */
      #parts-probe gd-button::part(button) {
        border: 4px dashed rgb(255, 0, 255) !important;
      }
      #parts-probe gd-button::part(content) {
        letter-spacing: 4px;
      }
      #parts-probe gd-input::part(input) {
        background: rgb(0, 255, 255);
      }
      #parts-probe gd-input::part(label) {
        text-transform: uppercase;
      }
      #parts-probe gd-checkbox::part(indicator) {
        outline: 3px solid rgb(255, 0, 0);
      }

      /* CONTROL: a descendant selector that must NOT reach into the shadow root. */
      #parts-probe gd-button button {
        border-width: 99px;
      }
    </style>
  </head>
  <body>
    <h1>Form participation + CSS Parts check</h1>
    <div id="root"></div>
    <script type="module" src="./form-participation-check.ts"></script>
  </body>
</html>
