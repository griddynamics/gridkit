<!doctype html>

  <body>
    <p>
      Same server-rendered DSD markup as ssr-dsd-static.html, but this page DOES load Lit's client JS afterward — see

    <!--lit-part uBEANW2yJC8=-->
    <gd-button variant="primary"
      ><template shadowroot="open" shadowrootmode="open"
        ><style>
          :host {
            display: inline-block;
          }
          button {
            font-family: inherit;
            border-style: solid;
            border-width: 0;
            border-color: transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
          }
          button[disabled] {
            cursor: default;
          }
          button:focus-visible {
            outline: 2px solid;
            outline-offset: 4px;
          }
          .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 9999px;
            animation: gd-button-spin 0.6s linear infinite;
          }

              transform: rotate(360deg);
            }

        <!--lit-node 0--><button
          style="border-radius: 0px; background-color: #ffb800; color: #000000; outline-color: #0069b4"

          <!--lit-node 2--><span style="color: #000000; font-weight: 500"><slot></slot></span>
          <slot name="icon-end"></slot>
          <!--lit-part--><!--/lit-part-->
        </button>
        <!--/lit-part--></template
      >Submit</gd-button

        ><!--lit-part hu3HhGy8jE4=--><!--lit-node 0-->
