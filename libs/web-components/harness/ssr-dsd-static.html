<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SSR/DSD static reproduction — NO client JS on this page</title>
  </head>
  <body>
    <p>This page has <strong>zero</strong> client-side JavaScript. If the button below is
    visibly styled (dark pill, not unstyled text), the browser attached the Declarative Shadow
    Root from the raw SSR HTML natively, with no hydration required.</p>
    <!--lit-part uBEANW2yJC8=-->
    <gd-button  variant="primary"><template shadowroot="open" shadowrootmode="open"><style>
    :host {
      display: inline-block;
    }
    button {
      display: inline-flex;
      align-items: center;
      position: relative;
      cursor: pointer;
    }
    button:disabled {
      cursor: default;
    }
    /* The real focus indicator is the ::after ring built in _buildCssText (matching
       getFocusStyles' inset -4px + real border) — reset the browser's own default
       :focus-visible outline so it isn't ALSO visible as a second, redundant ring. */
    button:focus-visible {
      outline: none;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 9999px;
      animation: gd-button-spin 0.6s linear infinite;
    }
    @keyframes gd-button-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style><!--lit-part 5j+ygR91o0k=-->
      <!--lit-node 0--><button
        type="button"
        role="button"
        tabindex="0"
        
        
        
        
      >
        <!--lit-part ghhjX44o8Fk=--><!--lit-node 0--><slot name="icon-start" ></slot><!--/lit-part-->
        <!--lit-part 843u56Ok1Mg=--><!--lit-node 0--><slot ></slot><!--/lit-part-->
        <!--lit-part 6qlD9cnqJ9M=--><!--lit-node 0--><slot name="icon-end" ></slot><!--/lit-part-->
        <!--lit-part--><!--/lit-part-->
      </button>
    <!--/lit-part--></template>Submit</gd-button>
    <gd-typography   variant="h1" as="h1"><template shadowroot="open" shadowrootmode="open"><style>
    :host {
      display: contents;
    }
  </style><!--lit-part hu3HhGy8jE4=--><!--lit-node 0--><h1 style="font-family:theme.font.family;font-size:font.size.h1;font-weight:theme.font.weight.normal;line-height:font.line.height.h1;margin-top:theme.spacing.xl;margin-bottom:theme.spacing.xl;"><slot></slot></h1><!--/lit-part--></template>Heading</gd-typography>
  <!--/lit-part-->
  </body>
</html>
