name: Publish UI Library to NPM

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Select the semantic version bump to publish for libs/ui
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Config Git User
        run: |
          git config user.name "Github Actions"
#          git config user.email "gridkit-support@gr1iddynamics.com"
          git fetch --tags --force

      - name: Release and publish ui
        run: npx nx release ${{ inputs.release_type }} --projects ui --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarize published version
        run: |
          echo "Published package: gd-design-library" >> "$GITHUB_STEP_SUMMARY"
          echo "Release type: ${{ inputs.release_type }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published version: $(node -p "require('./libs/ui/package.json').version")" >> "$GITHUB_STEP_SUMMARY"
