name: PR Head CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Code Formatting
        run: npm run format:check

      - name: Build Storybook
        run: npm run build-storybook

      - name: Build Form Configurator
        run: npm run build:form-configurator

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI library
        run: |
          set -eu
          npm run type-check
          npx nx build ui
          cp libs/ui/package.json dist/libs/ui/package.json
          node libs/ui/scripts/postbuild-types.mjs

      - name: Upload dist/libs/ui artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-libs-ui
          path: dist/libs/ui
          retention-days: 7
          if-no-files-found: error

  verify-ui:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist/libs/ui artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-libs-ui
          path: dist/libs/ui

      - name: Verify UI (knip · agadoo · madge · attw · publint · all phases)
        run: npm run verify:ui:ci

      - name: Upload verify report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-verify-report
          path: |
            libs/ui/scripts/output/report.html
            libs/ui/scripts/output/*.json
            libs/ui/scripts/output/history
          retention-days: 30

  # Verdaccio install + ESM/CJS smoke test. Too slow for every PR (~30-60s of
  # registry spin-up + real npm install). Runs only when:
  #   - a PR is opened/updated from a `release/*` branch (release readiness gate)
  #   - manually via workflow_dispatch (ad-hoc verification)
  verify-ui-install:
    needs: build-ui
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist/libs/ui artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-libs-ui
          path: dist/libs/ui

      - name: Verify UI install (Verdaccio publish + ESM/CJS smoke)
        run: npm run verify:ui:install

      - name: Upload install-check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-install-report
          path: |
            libs/ui/scripts/output/install-check-report.json
            libs/ui/scripts/output/report.html
            libs/ui/scripts/output/history
          retention-days: 30
